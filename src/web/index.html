<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AF2 · Советник рыбака</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f1ec; --surface: #ffffff; --surface-2: #f8f7f3; --sunken: #ecebe5;
  --ink: #1a1c19; --ink-2: #4f534b; --ink-3: #868a80; --line: #e2dfd6; --line-2: #d3d0c5;
  --accent: #1d6b58; --accent-ink: #ffffff; --accent-soft: #e2efe9; --accent-line: #b9d8cc;
  --warn: #9a5a12; --warn-soft: #f7ecdc; --bad: #a83a2a; --bad-soft: #f6e3df;
  --day: #b9770e; --night: #4f55c7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --other: #c9c6bd;
  --shadow: 0 1px 2px rgba(30, 28, 20, .06), 0 2px 8px rgba(30, 28, 20, .04);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111311; --surface: #191c19; --surface-2: #1f231f; --sunken: #151815;
    --ink: #ecebe5; --ink-2: #b6b9af; --ink-3: #82867d; --line: #2b302b; --line-2: #383e38;
    --accent: #5cc4a3; --accent-ink: #0c1f19; --accent-soft: #1b322b; --accent-line: #2c5446;
    --warn: #e0a85a; --warn-soft: #33281a; --bad: #ea8a78; --bad-soft: #3a211d;
    --day: #e3a640; --night: #9aa0f5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #4a4f49;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111311; --surface: #191c19; --surface-2: #1f231f; --sunken: #151815;
  --ink: #ecebe5; --ink-2: #b6b9af; --ink-3: #82867d; --line: #2b302b; --line-2: #383e38;
  --accent: #5cc4a3; --accent-ink: #0c1f19; --accent-soft: #1b322b; --accent-line: #2c5446;
  --warn: #e0a85a; --warn-soft: #33281a; --bad: #ea8a78; --bad-soft: #3a211d;
  --day: #e3a640; --night: #9aa0f5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #4a4f49;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

/* Layout */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface-2); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.brand-mark svg { width: 20px; height: 20px; }
.brand b { display: block; font-size: 15px; letter-spacing: .01em; }
.brand span { display: block; font-size: 12px; color: var(--ink-3); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.clock { padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.clock-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.clock-row .i { width: 16px; height: 16px; }
.clock small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.is-day { color: var(--day); }
.is-night { color: var(--night); }
.theme { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--sunken); }
.theme button { flex: 1; border: 0; background: none; padding: 4px; border-radius: 7px; cursor: pointer; color: var(--ink-3); font-size: 12px; }
.theme button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

main { min-width: 0; padding: 24px 32px 48px; max-width: 1240px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }
.top p { margin: 4px 0 0; color: var(--ink-2); max-width: 640px; }
.who { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; position: relative; }
.avatar.online::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #2fa36b; border: 2px solid var(--surface); }
.who select { border: 0; background: none; font-weight: 600; padding: 2px 22px 2px 2px; cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 9px) 50%, calc(100% - 4px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.who small { display: block; color: var(--ink-3); font-size: 12px; padding-left: 2px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 12px; margin-bottom: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.filter { display: flex; align-items: center; gap: 8px; }
.filter > span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--sunken); gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); white-space: nowrap; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.seg .i { width: 14px; height: 14px; }
.pick { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 6px 28px 6px 10px; cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; font-size: 13px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); }
.search input:focus, .pick:focus, .num-input:focus { outline: 2px solid var(--accent-line); outline-offset: 0; border-color: var(--accent); }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 16px; height: 16px; }
.num-input { width: 64px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); text-align: right; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 10px; }
.section-title h2 { margin: 0; font-size: 16px; }
.section-title span { color: var(--ink-3); font-size: 13px; }

.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.goal { text-align: left; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); transition: border-color .15s; }
.goal:hover { border-color: var(--line-2); }
.goal.on { border-color: var(--accent); background: var(--accent-soft); }
.goal-head { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.goal.on .goal-head { color: var(--accent); }
.goal-value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.goal-value small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.goal-where { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Option rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 32px; gap: 4px 14px; align-items: center; padding: 14px 14px 14px 12px; }
.opt.open { border-color: var(--line-2); }
.rank { font-size: 13px; color: var(--ink-3); font-weight: 600; text-align: center; align-self: start; padding-top: 2px; }
.opt.best .rank { color: var(--accent); }
.opt-title { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.opt-title b { font-size: 15px; }
.opt-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; color: var(--ink-2); font-size: 13px; }
.dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: 92px; gap: 6px; }
.stat { text-align: right; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: lowercase; }
.stat.lead b { color: var(--accent); font-size: 17px; }
.more { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.more:hover { background: var(--sunken); }
.more .i { width: 16px; height: 16px; transition: transform .15s; }
.opt.open .more .i { transform: rotate(180deg); }
.catch { grid-column: 2 / 4; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.detail { grid-column: 1 / -1; display: none; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.opt.open .detail { display: block; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--sunken); color: var(--ink-2); white-space: nowrap; text-decoration: none; border: 1px solid transparent; }
a.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.have { background: var(--accent-soft); color: var(--accent); }
.chip .bait-star { margin-left: 4px; font-size: 11px; line-height: 1; letter-spacing: -1px; opacity: 0.85; cursor: help; }
.bait-legend { margin: 6px 0 0; font-size: 12px; }

.chip.shop { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip .i { width: 13px; height: 13px; }
.time-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.time-tag .i { width: 14px; height: 14px; }

/* Catch bar */
.bar { display: flex; gap: 2px; height: 10px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.bar i { display: block; height: 100%; min-width: 3px; }
.bar i:first-child { border-radius: 4px 0 0 4px; }
.bar i:last-child { border-radius: 0 4px 4px 0; }
.bar i:only-child { border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.legend a { text-decoration: none; }
.legend a:hover { text-decoration: underline; }

/* Tables */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.table-card { overflow-x: auto; }
.table-card table th:first-child, .table-card table td:first-child { padding-left: 16px; }
.table-card table th:last-child, .table-card table td:last-child { padding-right: 16px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 8px; vertical-align: -1px; }

/* Profile (fish / bait) */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); text-decoration: none; font-size: 13px; margin-bottom: 10px; }
.back:hover { color: var(--ink); }
.profile { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
.facts { padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
.fact span { display: block; font-size: 12px; color: var(--ink-3); }
.fact b { display: block; font-size: 16px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.fact small { color: var(--ink-2); font-size: 12px; }
.where { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.where h3 { margin: 0; font-size: 13px; color: var(--ink-3); font-weight: 500; }
.where-base { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.where-base b { font-size: 13px; min-width: 120px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scale { position: relative; height: 34px; margin-top: 8px; }
.scale .track { position: absolute; left: 0; right: 0; top: 12px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--sunken), var(--accent-soft) 40%, var(--accent-line)); }
.scale .tick { position: absolute; top: 8px; width: 2px; height: 16px; background: var(--ink-3); border-radius: 1px; }
.scale .lim { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--bad); }
.scale label { position: absolute; top: 26px; font-size: 11px; color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; }

/* Catalog grids */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tile { padding: 14px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--accent-line); }
.tile-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tile-head b { font-size: 15px; }
.tile p { margin: 0; font-size: 12px; color: var(--ink-2); }
.tile .chips { margin-top: 2px; }
.group-title { margin: 22px 0 10px; font-size: 13px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* Rods */
.rods { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.rod { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.rod-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rod-head b { font-size: 16px; }
.parts { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; font-size: 13px; }
.parts span:nth-child(3n+1) { color: var(--ink-3); }
.parts .weak { color: var(--bad); font-weight: 600; }
.limit { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--sunken); }
.limit b { font-size: 20px; }
.mini { display: flex; flex-direction: column; gap: 6px; }
.mini div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }

/* Players */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.person { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.person-head { display: flex; gap: 12px; align-items: center; }
.person-head b { font-size: 16px; display: block; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kv div span { display: block; font-size: 12px; color: var(--ink-3); }
.kv div b { font-variant-numeric: tabular-nums; }

.empty { padding: 36px 20px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.note { margin-top: 24px; padding: 14px 16px; font-size: 13px; color: var(--ink-2); }
.note summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.note p { margin: 8px 0 0; }
.note label { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }
.loading { padding: 40px; text-align: center; color: var(--ink-3); }
.loading::before { content: ""; display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; margin-right: 8px; vertical-align: -2px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.warn-line { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 12px; }

@media (max-width: 1100px) {
  .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .profile { grid-template-columns: 1fr; }
  .stats { grid-auto-columns: 80px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; z-index: 5; height: auto; flex-direction: row; align-items: center; padding: 8px 12px; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 8px 0 0; }
  .brand div { display: none; }
  .nav { display: flex; gap: 2px; }
  .nav a { padding: 7px 10px; white-space: nowrap; }
  .nav a span { display: none; }
  .nav a.on span { display: inline; }
  .side-foot { margin: 0 0 0 auto; flex-direction: row; }
  .theme { display: none; }
  .clock { padding: 6px 10px; white-space: nowrap; }
  .clock small { display: none; }
  main { padding: 16px 16px 40px; }
  .opt { grid-template-columns: 24px minmax(0, 1fr) 32px; }
  .opt .stats { grid-column: 2 / 3; grid-row: 2; grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); grid-auto-columns: auto; }
  .opt .stat { text-align: left; }
  .opt .more { grid-column: 3; grid-row: 1; }
  .catch { grid-column: 2 / 3; }
  .kv { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .goals { grid-template-columns: 1fr 1fr; gap: 8px; }
  .goal { padding: 12px; }
  .goal-value { font-size: 20px; }
  .filters { gap: 8px; }
  .filter { width: 100%; justify-content: space-between; }
  .seg { overflow-x: auto; max-width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-3l5-3v12l-5-3c-4 3-10 2-13-3z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/></svg></div>
      <div><b>Atom Fishing 2</b><span>советник рыбака</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="clock" id="clock"></div>
      <div class="theme" id="theme"></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
      <div class="who" id="who"></div>
    </div>
    <div id="filters"></div>
    <div id="view"></div>
  </main>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (digits) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: digits, minimumFractionDigits: 0 });
const n0 = nf(0), n1 = nf(1), n2 = nf(2);
const money = (value) => `${value >= 100 ? n0.format(value) : value >= 10 ? n1.format(value) : n2.format(value)} кр.`;
const weight = (grams) => grams >= 1000 ? `${grams >= 10000 ? n1.format(grams / 1000) : n2.format(grams / 1000)} кг` : `${n0.format(grams)} г`;
const meters = (cm) => `${n2.format(cm / 100)} м`;
const pct = (share) => share >= 0.995 ? '100%' : share > 0 && share < 0.01 ? '<1%' : `${n0.format(share * 100)}%`;
const hhmm = (hours) => { const h = Math.floor(hours) % 24, m = Math.floor((hours % 1) * 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };
const duration = (seconds) => { const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60); return h > 0 ? `${h} ч ${m} мин` : `${m} мин`; };
const store = {
  get(key, fallback) { try { const value = localStorage.getItem('af2.' + key); return value === null ? fallback : JSON.parse(value); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem('af2.' + key, JSON.stringify(value)); } catch { /* private mode */ } },
};

const state = {
  world: null, characters: [], loadedAt: 0,
  who: store.get('who', ''), base: store.get('base', 'here'), time: store.get('time', 'now'), scope: store.get('scope', 'shop'),
  tackle: store.get('tackle', 'auto'), goal: store.get('goal', 'money'), fight: store.get('fight', 20), bottom: store.get('bottom', 200),
  query: '', theme: store.get('theme', 'auto'),
};
const cache = new Map();
let advice = null;

async function get(url) {
  const reply = await fetch(url, { cache: 'no-store' });
  if (!reply.ok) throw new Error(await reply.text());
  return reply.json();
}
async function adviceFor(extra = {}) {
  const params = new URLSearchParams();
  if (state.who) params.set('character', state.who);
  if (state.base !== 'here') params.set('base', state.base);
  if (state.time !== 'now') params.set('time', state.time);
  params.set('scope', state.scope);
  if (state.tackle !== 'auto') params.set('tackle', state.tackle);
  params.set('goal', state.goal);
  params.set('bottom', state.bottom);
  for (const [key, value] of Object.entries(extra)) if (value !== undefined && value !== null) params.set(key, value);
  const url = '/api/advisor?' + params;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.at < 20000) return hit.data;
  const data = await get(url);
  cache.set(url, { at: Date.now(), data });
  return data;
}

/* Lookups */
const W = () => state.world;
const baseName = (id) => W().bases.find((base) => base.id === id)?.name ?? `база ${id}`;
const locationOf = new Map();
const speciesById = new Map(), baitById = new Map();
function index() {
  locationOf.clear(); speciesById.clear(); baitById.clear();
  for (const base of W().bases) for (const location of base.locations) locationOf.set(location.id, { ...location, base: base.id });
  for (const one of W().species) speciesById.set(one.id, one);
  for (const bait of W().baits) baitById.set(bait.id, bait);
}
const placeName = (id) => locationOf.get(id)?.name ?? `локация ${id}`;
const speciesName = (id) => speciesById.get(id)?.name ?? `вид ${id}`;
const baitName = (id) => baitById.get(id)?.name ?? `наживка ${id}`;

/* Rates: the client asks for a bite every few seconds; a bite then takes the fight and a new cast. */
const bitesPerHour = (chance) => chance > 0 ? 3600 / (W().biteRequestSeconds / chance + Number(state.fight || 0)) : 0;
const perHour = (row) => {
  const bites = bitesPerHour(row.chance);
  return { bites, landed: bites * (1 - Math.max(0, row.lost)), money: bites * row.money, experience: bites * row.experience, trophies: bites * row.trophies };
};
const goalValue = (row, goal) => { const rate = perHour(row); return goal === 'bites' ? rate.landed : rate[goal]; };
const goalText = (value, goal) => goal === 'money' ? money(value) : n0.format(value) === '0' && value > 0 ? n1.format(value) : n0.format(value);

/* Species colours follow the species within a view: the first eight seen get the slots. */
function palette(rows) {
  const slots = new Map();
  for (const row of rows) for (const one of row.species.slice(0, 5)) {
    if (!slots.has(one.id) && slots.size < 8) slots.set(one.id, `var(--s${slots.size + 1})`);
  }
  return (id) => slots.get(id) ?? 'var(--other)';
}
function catchBar(row, color, top = 4) {
  const shown = row.species.filter((one) => color(one.id) !== 'var(--other)').slice(0, top);
  const rest = 1 - shown.reduce((sum, one) => sum + one.share, 0);
  const segments = shown.map((one) => `<i style="width:${one.share * 100}%;background:${color(one.id)}" title="${esc(speciesName(one.id))}: ${pct(one.share)}"></i>`).join('')
    + (rest > 0.005 ? `<i style="width:${rest * 100}%;background:var(--other)" title="Остальные: ${pct(rest)}"></i>` : '');
  const legend = shown.map((one) => `<span><i style="background:${color(one.id)}"></i><a href="#/fish/${one.id}">${esc(speciesName(one.id))}</a> ${pct(one.share)}</span>`).join('')
    + (rest > 0.005 ? `<span class="muted"><i style="background:var(--other)"></i>остальные ${pct(rest)}</span>` : '');
  return `<div class="bar">${segments}</div><div class="legend">${legend}</div>`;
}
function baitChip(id, base, mark = '') {
  const bait = baitById.get(id), owned = advice?.owned?.[id] || 0;
  const name = esc(baitName(id));
  if (owned > 0) return `<a class="chip have" href="#/bait/${id}" title="Есть у персонажа">${icon('bag')}${name} · ${n0.format(owned)} шт.${mark}</a>`;
  if (bait && bait.soldAt.includes(base) && bait.price > 0 && bait.level <= (advice?.character.level ?? 99)) {
    return `<a class="chip shop" href="#/bait/${id}" title="Продаётся на этой базе">${icon('shop')}${name} · ${money(bait.price)}${bait.pack > 1 ? ` за ${bait.pack}` : ''}${mark}</a>`;
  }
  return `<a class="chip" href="#/bait/${id}" title="Нет у персонажа и не продаётся здесь">${name}${mark}</a>`;
}
// Звёздочка живёт внутри карточки наживки: отдельной меткой рядом было не
// понять, к какой из них она относится, когда строка переносится.
const BAIT_CLASS = {
  1: { stars: '★', holds: 'крупная и трофейная', why: 'обычная срывается с неё чаще, чем остаётся' },
  2: { stars: '★★', holds: 'только трофейная', why: 'и обычная, и крупная срываются с неё чаще, чем остаются' },
};
function baitClassMark(fish, bait) {
  const level = fish.baitFromClass?.[bait];
  if (!level) return '';
  const { stars, holds, why } = BAIT_CLASS[level];
  const tip = `Насадка велика для мелкой рыбы: ${why}. Держится ${holds} ${fish.name.toLowerCase()}.`;
  return `<sup class="bait-star" title="${esc(tip)}">${stars}</sup>`;
}
function baitClassLegend(fish) {
  const levels = new Set(fish.baits.map((bait) => fish.baitFromClass?.[bait]).filter(Boolean));
  if (!levels.size) return '';
  const parts = [...levels].sort().map((level) => `${BAIT_CLASS[level].stars} — держится ${BAIT_CLASS[level].holds}`);
  return `<p class="muted bait-legend">${esc(parts.join(', '))}</p>`;
}
const timeTag = (night) => night ? `<span class="time-tag is-night">${icon('moon')}ночью</span>` : `<span class="time-tag is-day">${icon('sun')}днём</span>`;
function depthText(row) {
  const above = row.bottom - row.depth;
  const where = above <= 0 ? 'на дне' : above <= 100 ? `${n0.format(above)} см над дном` : `на глубине ${meters(row.depth)}`;
  const bottom = row.measured ? `глубина ${meters(row.bottom)}` : `глубина не измерена, беру ${meters(row.bottom)}`;
  const tip = row.measured ? 'Глубина из твоего последнего заброса на этой локации.' : 'Ты здесь ещё не забрасывал: глубину берём из «Как это считается» внизу страницы. Сделай заброс — и будет настоящая.';
  return `<span title="${esc(tip)}">${where} · ${row.measured ? bottom : `<span class="muted">${bottom}</span>`}</span>`;
}

/* Clock */
function gameHourNow() {
  const clock = W().clock;
  return (clock.gameHour + (Date.now() - state.loadedAt) / 3600000 * clock.gameHoursPerRealHour) % 24;
}
function isNightAt(hour) { const clock = W().clock; return hour >= clock.nightStart || hour < clock.nightEnd; }
function drawClock() {
  if (!W()) return;
  const clock = W().clock, hour = gameHourNow(), night = isNightAt(hour);
  const next = night ? clock.nightEnd : clock.nightStart;
  const left = ((next - hour + 24) % 24) / clock.gameHoursPerRealHour * 60;
  $('clock').innerHTML = `<div class="clock-row ${night ? 'is-night' : 'is-day'}">${icon(night ? 'moon' : 'sun')}${night ? 'Ночь' : 'День'} · ${hhmm(hour)}</div>
    <small>${night ? 'Рассвет' : 'Ночь'} через ${n0.format(Math.max(1, left))} мин</small>`;
  if (state.time === 'now' && advice && advice.nights[0] !== night) { cache.clear(); render(); }
}

/* Theme */
function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
  $('theme').innerHTML = [['auto', 'Авто'], ['light', 'Светлая'], ['dark', 'Тёмная']]
    .map(([id, title]) => `<button data-theme-pick="${id}" class="${state.theme === id ? 'on' : ''}">${title}</button>`).join('');
}

function drawWho() {

}
function seg(name, value, options) {

}
function filterBar(parts) {
  const bases = `<select class="pick" data-pick="base"><option value="here" ${state.base === 'here' ? 'selected' : ''}>Где персонаж</option><option value="all" ${state.base === 'all' ? 'selected' : ''}>Все базы</option>${W().bases.map((base) => `<option value="${base.id}" ${String(state.base) === String(base.id) ? 'selected' : ''}>${esc(base.name)}</option>`).join('')}</select>`;
  const pieces = {
    base: `<div class="filter"><span>База</span>${bases}</div>`,
    time: `<div class="filter"><span>Время</span>${seg('time', state.time, [['now', 'Сейчас', 'clock'], ['day', 'День', 'sun'], ['night', 'Ночь', 'moon'], ['both', 'Сутки']])}</div>`,

    tackle: `<div class="filter"><span>Снасть</span>${seg('tackle', state.tackle === 'auto' || state.tackle === 'none' ? state.tackle : 'auto', [['auto', 'Мои удочки'], ['none', 'Без предела']])}</div>`,
    search: `<div class="search">${icon('search')}<input id="search" type="search" placeholder="Найти по названию" value="${esc(state.query)}" autocomplete="off"></div>`,
  };
  return `<div class="filters">${parts.map((part) => pieces[part]).join('')}</div>`;
}
function setHeader(title, subtitle) { $('title').textContent = title; $('subtitle').textContent = subtitle; }
const loading = (text = 'Считаю…') => `<div class="loading">${esc(text)}</div>`;
const empty = (title, text) => `<div class="card empty"><b>${esc(title)}</b>${esc(text)}</div>`;

/* Option row (plan and fish views) */
function optionRow(row, i, color, lead, options = {}) {
  const rate = perHour(row);
  const stats = [
    ['money', money(rate.money), 'кр./час'],
    ['experience', n0.format(rate.experience), 'опыта/час'],
    ['bites', n0.format(rate.landed), 'рыб/час'],
    ['trophies', rate.trophies >= 1 ? n0.format(rate.trophies) : n1.format(rate.trophies), 'трофеев/час'],
  ];
  if (options.species) {
    const one = row.species.find((s) => s.id === options.species);
    stats.splice(0, 4,
      ['target', n1.format(rate.bites * one.share * (1 - Math.max(0, one.lost))), `${speciesName(options.species).toLowerCase()}/час`],
      ['share', pct(one.share), 'доля клёва'],
      ['weight', weight(one.grams), 'средний вес'],
      ['money', money(rate.money), 'кр./час']);
  }
  const warnings = [];
  if (row.noRod) warnings.push(`<span class="chip bad">${icon('warn')}нет удочки под эту наживку</span>`);
  if (row.lost > 0.05) warnings.push(`<span class="chip bad" title="Тяжелее, чем держит снасть: клиент её отпускает">сходит ${pct(row.lost)}</span>`);
  const place = `<b>${esc(placeName(row.location))}</b>${state.base === 'here' && !options.showBase ? '' : `<span class="muted">${esc(baseName(row.base))}</span>`}`;
  return `<article class="card opt ${i === 0 ? 'best' : ''}" data-row="${i}">
    <div class="rank">${i + 1}</div>
    <div><div class="opt-title">${place}</div>
      <div class="opt-meta">${baitChip(row.bait, row.base, options.fish ? baitClassMark(options.fish, row.bait) : '')}<span>${depthText(row)}</span>${state.time === 'both' || options.alwaysTime ? timeTag(row.night) : ''}${warnings.join('')}</div></div>
    <div class="stats">${stats.map(([id, value, label]) => `<div class="stat ${id === lead ? 'lead' : ''}"><b>${value}</b><span>${label}</span></div>`).join('')}</div>
    <button class="more" data-toggle="${i}" aria-label="Подробнее">${icon('down')}</button>
    <div class="catch">${catchBar(row, color)}</div>
    <div class="detail">${speciesTable(row, color)}</div>
  </article>`;
}
function speciesTable(row, color) {
  const rate = perHour(row);
  return `<table><thead><tr><th>Рыба</th><th class="r">Доля клёва</th><th class="r">В час</th><th class="r">Средний вес</th><th class="r">Цена</th><th class="r">Опыт</th><th class="r">Трофеи</th><th class="r">Сходит</th></tr></thead><tbody>
    ${row.species.map((one) => `<tr><td><span class="swatch" style="background:${color(one.id)}"></span><a href="#/fish/${one.id}">${esc(speciesName(one.id))}</a></td>
      <td class="r">${pct(one.share)}</td><td class="r">${n1.format(rate.bites * one.share * (1 - Math.max(0, one.lost)))}</td><td class="r">${weight(one.grams)}</td>
      <td class="r">${money(one.money)}</td><td class="r">${n0.format(one.experience)}</td><td class="r">${pct(one.trophies)}</td><td class="r">${one.lost > 0.005 ? pct(one.lost) : '—'}</td></tr>`).join('')}
  </tbody></table>
  <p class="muted" style="margin:10px 0 0;font-size:12px">Шанс поклёвки на запрос клиента — ${pct(row.chance)}, поклёвка примерно раз в ${n0.format(W().biteRequestSeconds / row.chance)} с ожидания. Цена и опыт — в среднем за поклёвку этого вида, с навыками, репутацией базы и VIP; сошедшая рыба ничего не приносит.</p>`;
}

function methodNote() {
  return `<details class="card note"><summary>Как это считается</summary>
    <p>Сервер считает прогноз теми же функциями, что и настоящую поклёвку: какие рыбы есть на локации, кто берёт эту наживку на этой глубине днём или ночью, шанс поклёвки с привлекательностью наживки и навыками, вес с удачей, цену у скупщика и опыт с образованием, репутацией базы и VIP персонажа.</p>
    <p>Снасть: клиент отпускает рыбу тяжелее 2,5 × самого слабого из тестов удилища и лески — такая рыба считается сошедшей. Глубина: пробуются «на дне», чуть выше досягаемости донной рыбы (у дна она клюёт в 2,5 раза чаще, выше — втрое реже, и доля остальных растёт) и глубины, ниже которых часть рыб не берёт; показана лучшая для цели. Дно — из последнего заброса персонажа на этой локации, а где он не забрасывал (со знаком «?») — <input class="num-input" type="number" min="10" max="3000" step="10" data-pick="bottom" value="${esc(state.bottom)}"> см.</p>
    <p>В час: клиент спрашивает поклёвку раз в ${n0.format(W().biteRequestSeconds)} с, и на вываживание с новым забросом уходит <input class="num-input" type="number" min="0" max="300" step="1" data-pick="fight" value="${esc(state.fight)}"> с.</p>
  </details>`;
}

/* Views */
async function viewPlan(box) {
  setHeader('Лучший улов', VIEWS[0].hint);
  $('filters').innerHTML = filterBar(['base', 'time', 'scope', 'tackle']);
  box.innerHTML = loading();
  advice = await adviceFor();
  drawWho();
  const rows = advice.rows.slice().sort((a, b) => goalValue(b, state.goal) - goalValue(a, state.goal));
  const best = (goal) => advice.rows.reduce((top, row) => (!top || goalValue(row, goal) > goalValue(top, goal) ? row : top), null);
  const cards = GOALS.map((goal) => {
    const row = best(goal.id);

function baitStats(bait) {
  const takers = W().species.filter((one) => one.baits.includes(bait.id));

}

const plural = (n, one, few, many) => { const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? one : t >= 2 && t <= 4 && (h < 12 || h > 14) ? few : many; };

async function viewBait(box, id) {
  const bait = baitById.get(id);
  setHeader(bait ? bait.name : 'Наживка', bait ? `${BAIT_KINDS[bait.kind] ?? 'Наживка'} — кто и где на неё клюёт.` : '');
  $('filters').innerHTML = filterBar(['base', 'time', 'tackle']);
  box.innerHTML = loading();
  advice = await adviceFor({ bait: id, scope: 'all', depths: 'all', goal: 'bites' });
  drawWho();
  if (!bait) { box.innerHTML = empty('Нет такой наживки', ''); return; }
  const owned = advice.owned[id] || 0;
  const takers = baitStats(bait).takers;
  const rods = Object.entries(ROD_KINDS).filter(([kind]) => (bait.kind === 12) === (Number(kind) === 3)).map(([, name]) => name.toLowerCase()).join(', ');
  // Per place and time: the depth with the best bite, plus the fish that take it only higher up.
  const groups = new Map();
  for (const row of advice.rows) {
    const key = `${row.base}:${row.location}:${row.night}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  const places = [...groups.values()].map((rows) => {
    rows.sort((a, b) => b.chance - a.chance);
    const main = rows[0], seen = new Set(main.species.map((one) => one.id));
    const higher = rows.slice(1).flatMap((row) => row.species.filter((one) => !seen.has(one.id)).map((one) => { seen.add(one.id); return { id: one.id, depth: row.depth }; }));
    return { main, higher };
  }).sort((a, b) => b.main.chance - a.main.chance);
  const color = palette(places.map((place) => place.main));
  const list = places.map(({ main, higher }, i) => {
    const rate = perHour(main);
    return `<article class="card opt" data-row="${i}">
      <div class="rank">${i + 1}</div>
      <div><div class="opt-title"><b>${esc(placeName(main.location))}</b><span class="muted">${esc(baseName(main.base))}</span></div>
        <div class="opt-meta"><span>${depthText(main)}</span>${state.time === 'both' ? timeTag(main.night) : ''}${main.lost > 0.05 ? `<span class="chip bad">сходит ${pct(main.lost)}</span>` : ''}</div></div>
      <div class="stats"><div class="stat lead"><b>${n0.format(rate.landed)}</b><span>рыб/час</span></div><div class="stat"><b>${money(rate.money)}</b><span>кр./час</span></div><div class="stat"><b>${n0.format(rate.experience)}</b><span>опыта/час</span></div></div>
      <button class="more" aria-label="Подробнее">${icon('down')}</button>
      <div class="catch">${catchBar(main, color, 5)}${higher.length ? `<div class="legend muted">Выше дна ещё: ${higher.map((one) => `<a href="#/fish/${one.id}">${esc(speciesName(one.id))}</a> (до ${meters(one.depth)})`).join(', ')}</div>` : ''}</div>
      <div class="detail">${speciesTable(main, color)}</div>
    </article>`;
  }).join('');
  const soldAt = bait.soldAt.map((base) => `<span class="chip shop">${icon('shop')}${esc(baseName(base))}</span>`).join('') || '<span class="muted">нигде не продаётся</span>';
  box.innerHTML = `<a class="back" href="#/baits">${icon('back')}Все наживки</a>
    <div class="profile">
      <div class="card facts">
        <div class="fact"><span>У тебя</span><b>${owned ? `${n0.format(owned)} шт.` : 'нет'}</b></div>
        <div class="fact"><span>Цена в магазине</span><b>${bait.price > 0 ? money(bait.price) : '—'}</b>${bait.pack > 1 ? `<small>за ${bait.pack} шт.</small>` : ''}</div>
        <div class="fact"><span>Уровень</span><b>${bait.level > 1 ? `с ${bait.level}` : 'любой'}</b></div>
        <div class="fact"><span>Удочка</span><b>${esc(rods)}</b></div>
      </div>
      <div class="card where"><h3>Продаётся</h3><div class="chips">${soldAt}</div>
        <h3>Берут (${takers.length})</h3><div class="chips">${takers.map((one) => `<a class="chip" href="#/fish/${one.id}">${esc(one.name)}</a>`).join('')}</div></div>
    </div>
    <div class="section-title"><h2>Где клюёт</h2><span>${places.length ? `${places.length} ${plural(places.length, 'место', 'места', 'мест')}` : ''}</span></div>
    ${places.length ? `<div class="list">${list}</div>` : empty('Здесь на неё не клюёт', 'Выбери другую базу или «Все базы».')}

}

/* Routing */
function route() {
  const [view = '', id] = location.hash.replace(/^#\/?/, '').split('/');
  return { view: view || 'plan', id: id ? Number(id) : null };
}
let drawing = 0;
async function render() {
  const { view, id } = route();
  const mine = ++drawing;
  drawNav(view === 'bait' ? 'baits' : view);
  const box = $('view');
  try {
    if (view === 'plan') await viewPlan(box);
    else if (view === 'baits') await viewBaits(box);
    else if (view === 'bait') await viewBait(box, id);
    else if (view === 'fish' && id) await viewFish(box, id);
    else if (view === 'fish') await viewFishList(box);
    else if (view === 'tackle') await viewTackle(box);
    else if (view === 'players') await viewPlayers(box);
    else { location.hash = '#/'; return; }
  } catch (error) {
    if (mine === drawing) box.innerHTML = empty('Не получилось', error.message);
  }
  drawWho();
}

/* Events */
document.addEventListener('click', (event) => {
  const set = event.target.closest('[data-set]');
  if (set) {
    state[set.dataset.set] = set.dataset.value;
    store.set(set.dataset.set, set.dataset.value);
    render();
    return;
  }
  const theme = event.target.closest('[data-theme-pick]');
  if (theme) { state.theme = theme.dataset.themePick; store.set('theme', state.theme); applyTheme(); return; }
  const more = event.target.closest('.more');
  if (more) { more.closest('.opt').classList.toggle('open'); return; }
  const row = event.target.closest('.opt');
  if (row && !event.target.closest('a, button, input')) row.classList.toggle('open');
});
document.addEventListener('change', (event) => {
  if (event.target.id === 'who-pick') {
    state.who = event.target.value; store.set('who', state.who); advice = null; cache.clear(); render(); return;
  }
  const pick = event.target.closest('[data-pick]');
  if (pick) {
    const key = pick.dataset.pick;
    state[key] = key === 'fight' || key === 'bottom' ? Number(pick.value) || 0 : pick.value;
    store.set(key, state[key]);
    render();
  }
});
let typing = null;
document.addEventListener('input', (event) => {
  if (event.target.id !== 'search') return;
  state.query = event.target.value;
  clearTimeout(typing);
  typing = setTimeout(async () => {
    const at = event.target.selectionStart;
    await render();
    const input = $('search');
    if (input) { input.focus(); input.setSelectionRange(at, at); }
  }, 150);
});
window.addEventListener('hashchange', () => { state.query = ''; render(); window.scrollTo(0, 0); });

async function start() {
  applyTheme();
  $('view').innerHTML = loading('Загружаю…');
  try {
    [state.world, state.characters] = await Promise.all([get('/api/world'), get('/api/characters')]);
  } catch (error) {
    $('view').innerHTML = empty('Сервер не отвечает', error.message);
    return;
  }
  state.loadedAt = Date.now();
  index();
  drawClock();
  setInterval(drawClock, 15000);
  setInterval(async () => {
    if (route().view === 'players') render();
    try { state.characters = await get('/api/characters'); drawWho(); } catch { /* next time */ }
  }, 10000);
  render();
}
start();
</script>
</body>
</html>
